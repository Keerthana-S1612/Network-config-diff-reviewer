# ==========================================
# ENTERPRISE AUTOMATED CONTINOUS RUNNER (GHA)
# ==========================================

name: AegisOps Core Continuous Runner

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build, Lint, and Compile React Assets
  frontend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v3

      - name: Configure Node Environment
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Resolve Core Packages
        run: npm ci

      - name: Static Verification compilation
        run: npm run lint

      - name: Compile and Bundle React static pages
        run: npm run build

  # Job 2: Run Python Testing Matrix
  backend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v3

      - name: Configure Python Interpreter
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Resolve FastAPI Dependencies
        run: pip install -r backend/requirements.txt

      - name: Execute automated PyTest suites
        run: pytest tests/

  # Job 3: Compile and Verify Docker Assembly Integrity
  docker-delivery-pipeline:
    needs: [frontend-pipeline, backend-pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v3

      - name: Setup Virtual Docker Builders
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker Compose Build configurations
        run: docker compose build --no-cache
